<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EVE — Hero + Estado A</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --eve-ink: #12141a;
        --eve-sheet: #fafbfc;
        --eve-graphite: #17191f;
        --eve-mist: #7a8190;
        --eve-line: #d8dce2;
        --eve-font-display: "Cormorant Garamond", "Times New Roman", serif;
        --eve-font-body: "Source Sans 3", "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--eve-sheet);
        color: var(--eve-ink);
        font-family: var(--eve-font-body);
        -webkit-font-smoothing: antialiased;
      }

      .estadoAScreen {
        min-height: 100svh;
        background: var(--eve-sheet);
        color: var(--eve-ink);
        width: 100%;
        margin: 0 auto;
        padding: 0 0 96px;
      }

      .estadoATopbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 36px;
        width: 100%;
        margin: 0;
        padding: 24px clamp(24px, 4vw, 56px);
        background: var(--eve-sheet);
      }

      .logo {
        display: inline-flex;
        align-items: center;
        --eve-text-size: 7px;
        --eve-tracking: 0.42em;
        --eve-tm-size: 4px;
      }

      .logo .letters {
        font-family: Inter, Arial, Helvetica, sans-serif;
        font-size: var(--eve-text-size);
        font-weight: 600;
        letter-spacing: var(--eve-tracking);
        line-height: 1;
        color: #272a32;
        white-space: nowrap;
      }

      .logo .tm {
        font-family: Inter, Arial, Helvetica, sans-serif;
        font-size: var(--eve-tm-size);
        font-weight: 400;
        letter-spacing: 0;
        line-height: 1;
        vertical-align: top;
        margin-left: 1px;
        color: #272a32;
      }

      .estadoASlogan {
        color: var(--eve-mist);
        font-size: 8px;
        font-weight: 500;
        letter-spacing: 0.36em;
        line-height: 1;
        text-align: right;
        white-space: nowrap;
      }

      .estadoAVestibule {
        display: grid;
        grid-template-columns: minmax(0, 1.08fr) minmax(300px, 0.92fr);
        width: 100%;
        margin: 0;
        min-height: clamp(400px, 52vh, 620px);
        background: var(--eve-sheet);
      }

      .estadoAChamber {
        position: relative;
        overflow: hidden;
        background: var(--eve-graphite);
        min-height: inherit;
      }

      .estadoAChamberImage {
        display: block;
        width: 100%;
        height: 100%;
        min-height: inherit;
        object-fit: cover;
        object-position: center 42%;
      }

      .estadoAThresholdCopy {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 24px;
        padding: clamp(40px, 6vw, 88px) clamp(32px, 5vw, 72px);
        background: var(--eve-sheet);
      }

      .estadoAMonumentLine {
        margin: 0;
        color: var(--eve-ink);
        font-family: var(--eve-font-display);
        font-size: clamp(36px, 3.8vw, 54px);
        font-weight: 600;
        line-height: 1.08;
        letter-spacing: 0.01em;
      }

      .estadoAMonumentLead {
        display: block;
      }

      .estadoAMonumentEmphasis {
        display: block;
        font-style: italic;
        font-weight: 500;
      }

      .estadoAMonumentSub {
        margin: 0;
        color: var(--eve-mist);
        font-family: var(--eve-font-body);
        font-size: 15px;
        font-weight: 400;
        line-height: 1.45;
      }

      .estadoAWorkspace {
        width: min(100%, 760px);
        margin: 0 auto;
        padding: clamp(56px, 7vw, 88px) clamp(24px, 4vw, 48px) 0;
        text-align: center;
      }

      .estadoAGreetingRow {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 18px;
        margin: 0 0 56px;
        width: 100%;
      }

      .estadoAGreeting {
        margin: 0;
        color: var(--eve-mist);
        font-size: 14px;
        line-height: 1.4;
      }

      .linkButton {
        border: 0;
        background: transparent;
        color: var(--eve-mist);
        font-family: var(--eve-font-body);
        font-size: 14px;
        line-height: 1.4;
        cursor: default;
        padding: 0;
      }

      .estadoARoomMark {
        margin: 0 0 64px;
        color: var(--eve-ink);
        font-family: var(--eve-font-body);
        font-size: clamp(17px, 1.8vw, 21px);
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .estadoAInscriptions {
        display: flex;
        flex-direction: column;
        gap: 64px;
      }

      .estadoAInscription {
        text-align: center;
      }

      .estadoAInscriptionQuestion {
        margin: 0 0 32px;
        color: var(--eve-ink);
        font-family: var(--eve-font-body);
        font-size: clamp(16px, 1.65vw, 19px);
        font-weight: 700;
        line-height: 1.4;
      }

      .estadoAInscriptionOptions {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .estadoAInscriptionOption {
        border: 0;
        background: transparent;
        color: var(--eve-mist);
        font-family: var(--eve-font-body);
        font-size: 15px;
        font-weight: 400;
        line-height: 1.5;
        text-align: center;
        padding: 2px 6px;
      }

      .estadoAMonumentFooter {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding-top: 72px;
      }

      .estadoATrace {
        border: 0;
        border-bottom: 1px solid var(--eve-ink);
        background: transparent;
        color: var(--eve-ink);
        font-family: var(--eve-font-body);
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.02em;
        padding: 0 0 6px;
      }
    </style>
  </head>
  <body>
    <section class="estadoAScreen" id="estado-a">
      <header class="estadoATopbar">
        <div class="logo" aria-label="EVE">
          <span class="letters">EVE<sup class="tm">™</sup></span>
        </div>
        <div class="estadoASlogan">
          Strategic &amp; Operational Architecture&nbsp; / Enterprise Viability Engine
        </div>
      </header>

      <div class="estadoAVestibule">
        <div class="estadoAChamber">
          <img
            alt=""
            class="estadoAChamberImage"
            src="./eve-hero-corridor-color.jpg"
          />
        </div>
        <div class="estadoAThresholdCopy">
          <h1 class="estadoAMonumentLine">
            <span class="estadoAMonumentLead">Lo que sostiene</span>
            <span class="estadoAMonumentEmphasis">no siempre se ve.</span>
          </h1>
          <p class="estadoAMonumentSub">Una forma distinta de mirar.</p>
        </div>
      </div>

      <div class="estadoAWorkspace">
        <div class="estadoAGreetingRow">
          <p class="estadoAGreeting">Hola, Gaby Johnson.</p>
          <button class="linkButton" type="button">Cerrar sesión</button>
        </div>

        <p class="estadoARoomMark">[ Comienza tu levantamiento ]</p>

        <div class="estadoAInscriptions">
          <section class="estadoAInscription">
            <h2 class="estadoAInscriptionQuestion">
              ¿Desde qué lugar participas normalmente en la empresa?
            </h2>
            <div class="estadoAInscriptionOptions" role="radiogroup">
              <button class="estadoAInscriptionOption" type="button">
                Soy dueño/a, socio/a o parte de la dirección general.
              </button>
              <button class="estadoAInscriptionOption" type="button">
                Estoy a cargo o dirijo un área.
              </button>
              <button class="estadoAInscriptionOption" type="button">
                Superviso o coordino el trabajo de otras personas.
              </button>
              <button class="estadoAInscriptionOption" type="button">
                Analizo información, datos o procesos de la empresa.
              </button>
              <button class="estadoAInscriptionOption" type="button">
                Apoyo en administración, ventas, producción, atención o soporte.
              </button>
              <button class="estadoAInscriptionOption" type="button">
                Participo como externo, asesor o proveedor.
              </button>
              <button class="estadoAInscriptionOption" type="button">Otro.</button>
            </div>
          </section>

          <section class="estadoAInscription">
            <h2 class="estadoAInscriptionQuestion">
              ¿Qué tan cerca estás de las decisiones?
            </h2>
            <div class="estadoAInscriptionOptions" role="radiogroup">
              <button class="estadoAInscriptionOption" type="button">
                Las tomo directamente
              </button>
              <button class="estadoAInscriptionOption" type="button">
                Participo en decidirlas
              </button>
              <button class="estadoAInscriptionOption" type="button">
                Las propongo o las preparo
              </button>
              <button class="estadoAInscriptionOption" type="button">
                Las ejecuto cuando ya fueron decididas
              </button>
              <button class="estadoAInscriptionOption" type="button">
                Las vivo como impacto, pero no participo mucho en decidirlas
              </button>
            </div>
          </section>
        </div>

        <footer class="estadoAMonumentFooter">
          <button class="estadoATrace" type="button">Guardar</button>
        </footer>
      </div>
    </section>
  </body>
</html>
