<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <title>EVE — B0 · Secuencia void v2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --eve-ink: #12141a;
        --eve-sheet: #fafbfc;
        --eve-mist: #7a8190;
        --font-kicker: "IBM Plex Mono", "Consolas", monospace;
        --font-activity: "IBM Plex Mono", "Consolas", monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100svh;
        background: var(--eve-sheet);
        color: var(--eve-ink);
        font-family: var(--font-kicker);
        -webkit-font-smoothing: antialiased;
      }

      .void {
        position: relative;
        min-height: 100svh;
        width: min(1440px, 100%);
        margin: 0 auto;
        padding: 88px 72px 72px;
        overflow: hidden;
      }

      .intro {
        margin: 0;
        max-width: 260px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--eve-ink);
        opacity: 0;
        transition: color 900ms ease, opacity 900ms ease;
      }

      .intro.is-visible {
        opacity: 1;
      }

      .intro.is-mist {
        color: var(--eve-mist);
      }

      .flow {
        position: absolute;
        top: 148px;
        left: 72px;
        right: 72px;
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: clamp(24px, 4vw, 72px);
        align-items: start;
      }

      .flow-step {
        min-width: 0;
        max-width: 34ch;
        opacity: 0;
        visibility: hidden;
      }

      .flow-step.is-active {
        opacity: 1;
        visibility: visible;
      }

      .step-label {
        margin: 0;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--eve-ink);
        min-height: 1.4em;
        white-space: nowrap;
      }

      .step-value {
        margin: 28px 0 0;
        font-family: var(--font-activity);
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.02em;
        line-height: 1.5;
        color: var(--eve-ink);
        max-width: 44ch;
        min-height: 3em;
      }

      .cursor {
        display: inline-block;
        width: 1px;
        height: 0.95em;
        margin-left: 1px;
        background: var(--eve-ink);
        vertical-align: text-bottom;
        animation: blink 900ms step-end infinite;
      }

      .cursor.is-hidden {
        display: none;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }

      .replay {
        position: fixed;
        bottom: 24px;
        right: 24px;
        border: 0;
        background: transparent;
        color: var(--eve-mist);
        font-family: var(--font-kicker);
        font-size: 9px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        cursor: pointer;
        opacity: 0;
        pointer-events: none;
        transition: opacity 400ms ease, color 200ms ease;
      }

      .replay.is-visible {
        opacity: 1;
        pointer-events: auto;
      }

      .replay:hover {
        color: var(--eve-ink);
      }

      @media (max-width: 900px) {
        .void {
          padding: 72px 24px 48px;
        }

        .flow {
          left: 24px;
          right: 24px;
          top: 160px;
          grid-template-columns: 1fr;
          gap: 36px;
        }
      }
    </style>
  </head>
  <body>
    <main class="void" aria-label="B0 secuencia void monumental">
      <p class="intro" id="intro">Miremos de cerca…</p>

      <section class="flow" aria-label="Flujo horizontal">
        <div class="flow-step" id="step-one" data-step="1">
          <p class="step-label" id="label-one"></p>
          <p class="step-value" id="value-one"></p>
        </div>
        <div class="flow-step" id="step-two" data-step="2">
          <p class="step-label" id="label-two"></p>
          <p class="step-value" id="value-two"></p>
        </div>
        <div class="flow-step" id="step-three" data-step="3">
          <p class="step-label" id="label-three"></p>
          <p class="step-value" id="value-three"></p>
        </div>
        <div class="flow-step" id="step-four" data-step="4">
          <p class="step-label" id="label-four"></p>
          <p class="step-value" id="value-four"></p>
        </div>
      </section>
    </main>

    <button class="replay" id="replay" type="button">Repetir secuencia</button>

    <script>
      const DEFAULT_ACTIVITY =
        "Analizo la proyección mensual de erogaciones comparando el gasto real contra Oracle para generar reportes de desviaciones con análisis de causa raíz.";
      const DEFAULT_OBJECT = "la proyección mensual de erogaciones";
      const DEFAULT_STEPS = "comparando el gasto real contra Oracle";
      const DEFAULT_RESULT =
        "reportes de desviaciones con análisis de causa raíz";

      const params = new URLSearchParams(window.location.search);
      const activityText = (params.get("actividad") || DEFAULT_ACTIVITY).trim();
      const objectText = (params.get("objeto") || DEFAULT_OBJECT).trim();
      const stepsText = (params.get("pasos") || DEFAULT_STEPS).trim();
      const resultText = (params.get("resultado") || DEFAULT_RESULT).trim();

      const introEl = document.getElementById("intro");
      const steps = [
        {
          el: document.getElementById("step-one"),
          label: document.getElementById("label-one"),
          value: document.getElementById("value-one"),
          labelText: "I · Qué haces",
          valueText: activityText,
        },
        {
          el: document.getElementById("step-two"),
          label: document.getElementById("label-two"),
          value: document.getElementById("value-two"),
          labelText: "II · Sobre qué trabajas",
          valueText: objectText,
        },
        {
          el: document.getElementById("step-three"),
          label: document.getElementById("label-three"),
          value: document.getElementById("value-three"),
          labelText: "III · Pasos del recorrido",
          valueText: stepsText,
        },
        {
          el: document.getElementById("step-four"),
          label: document.getElementById("label-four"),
          value: document.getElementById("value-four"),
          labelText: "IV · Qué queda listo",
          valueText: resultText,
        },
      ];
      const replayEl = document.getElementById("replay");

      let runId = 0;

      function sleep(ms, token) {
        return new Promise((resolve) => {
          window.setTimeout(() => {
            if (token === runId) resolve();
          }, ms);
        });
      }

      function makeCursor() {
        const cursor = document.createElement("span");
        cursor.className = "cursor";
        cursor.setAttribute("aria-hidden", "true");
        return cursor;
      }

      async function typewriter(target, text, speed, token) {
        if (!target || token !== runId) return;
        target.textContent = "";
        const cursor = makeCursor();
        target.appendChild(cursor);

        for (let i = 0; i < text.length; i += 1) {
          if (token !== runId) return;
          cursor.insertAdjacentText("beforebegin", text.charAt(i));
          await sleep(speed, token);
        }

        if (token === runId) cursor.classList.add("is-hidden");
      }

      function resetVisual() {
        introEl.classList.remove("is-visible", "is-mist");
        for (const step of steps) {
          step.el.classList.remove("is-active");
          step.label.textContent = "";
          step.value.textContent = "";
        }
        replayEl.classList.remove("is-visible");
      }

      async function playStep(step, token, gapBeforeMs) {
        if (gapBeforeMs > 0) {
          await sleep(gapBeforeMs, token);
          if (token !== runId) return false;
        }

        step.el.classList.add("is-active");
        await typewriter(step.label, step.labelText, 34, token);
        if (token !== runId) return false;

        await sleep(2000, token);
        if (token !== runId) return false;

        await typewriter(step.value, step.valueText, 16, token);
        return token === runId;
      }

      async function runSequence() {
        runId += 1;
        const token = runId;
        resetVisual();

        await sleep(120, token);
        if (token !== runId) return;
        introEl.classList.add("is-visible");

        await sleep(3000, token);
        if (token !== runId) return;
        introEl.classList.add("is-mist");

        await sleep(400, token);
        if (token !== runId) return;

        for (let i = 0; i < steps.length; i += 1) {
          const ok = await playStep(steps[i], token, i === 0 ? 0 : 500);
          if (!ok) return;
        }

        replayEl.classList.add("is-visible");
      }

      replayEl.addEventListener("click", () => {
        runSequence();
      });

      runSequence();
    </script>
  </body>
</html>
