<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <!--
      PROPUESTA 2 · BUILD 2.0 · validación visual (no freeze aprobado aún)
      B0 · Sección 3 · Frecuencia
      Contrato: B0-Q03 (frequency_base, typical_context, primary_actor_scope)
      + foreshadow variación (C01) — UI only

      Diferencia vs Propuesta 1:
      - P1 = islas documentales (grid 2+1, flujo vertical de hoja)
      - P2 = triángulo Cómo ocurre (columnas asimétricas + señal en el void)

      Lenguaje: misma familia void local (IBM Plex Mono, mist→ink)
      Destino previsto: LocalB0FrecuenciaSection (alternativa compositva)
    -->
    <title>EVE — B0 · Frecuencia · Triángulo v2.0 (PROPUESTA 2)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --eve-ink: #12141a;
        --eve-sheet: #fafbfc;
        --eve-mist: #7a8190;
        --eve-mist-dim: #9aa1ab;
        --eve-line: #d8dce2;
        --font-mono: "IBM Plex Mono", "Consolas", monospace;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100svh;
        background: var(--eve-sheet);
        color: var(--eve-ink);
        font-family: var(--font-mono);
        -webkit-font-smoothing: antialiased;
      }

      .build {
        position: fixed;
        top: 16px;
        right: 20px;
        z-index: 30;
        margin: 0;
        color: var(--eve-mist-dim);
        font-size: 8px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .error {
        position: fixed;
        top: 40px;
        right: 20px;
        z-index: 30;
        max-width: 42ch;
        color: #8a2f2f;
        font-size: 10px;
        line-height: 1.4;
        display: none;
      }

      .error.is-visible {
        display: block;
      }

      .screen {
        position: relative;
        width: min(1440px, 100%);
        min-height: calc(
          clamp(280px, 32vh, 360px) + clamp(480px, 52vh, 580px) +
            clamp(64px, 6vh, 88px)
        );
        margin: 0 auto;
        padding-bottom: clamp(64px, 6vh, 88px);
        background: var(--eve-sheet);
      }

      /* Intro esquina — patrón Cómo ocurre */
      .intro-corner {
        position: absolute;
        top: 12px;
        left: clamp(24px, 5vw, 72px);
        right: clamp(24px, 5vw, 72px);
        max-width: 46ch;
        z-index: 3;
        text-align: left;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 700ms ease,
          visibility 700ms ease;
      }

      .intro-corner.is-active {
        opacity: 1;
        visibility: visible;
      }

      .stage-intro-lead {
        margin: 0 0 18px;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--eve-mist);
      }

      .stage-intro-ask {
        margin: 0;
        min-height: 1.6em;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.01em;
        line-height: 1.55;
        color: var(--eve-mist);
      }

      .cursor {
        display: inline-block;
        width: 1px;
        height: 0.95em;
        margin-left: 1px;
        background: currentColor;
        vertical-align: text-bottom;
        animation: blink 900ms step-end infinite;
      }

      .cursor.is-hidden {
        display: none;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }

      /* Campo triangular: 2 columnas con gran void central */
      .field {
        position: absolute;
        top: clamp(200px, 24vh, 280px);
        left: clamp(24px, 5vw, 72px);
        right: clamp(24px, 5vw, 72px);
        min-height: clamp(480px, 52vh, 580px);
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        gap: clamp(180px, 24vw, 360px);
        align-items: start;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 900ms ease,
          visibility 900ms ease;
      }

      .field.is-visible {
        opacity: 1;
        visibility: visible;
      }

      .column {
        min-width: 0;
        max-width: 28ch;
      }

      .column-left {
        display: flex;
        flex-direction: column;
        gap: 56px;
        justify-self: start;
      }

      .column-right {
        justify-self: end;
        text-align: right;
      }

      .column-right .q-block {
        margin-left: auto;
      }

      .q-block {
        width: 100%;
        max-width: 28ch;
        opacity: 0;
        transform: translateY(6px);
        transition:
          opacity 700ms ease,
          transform 700ms ease;
      }

      .q-block.is-active {
        opacity: 1;
        transform: translateY(0);
      }

      .q-label {
        margin: 0;
        font-size: 8px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--eve-mist);
        min-height: 1.4em;
        line-height: 1.4;
      }

      .q-label.is-ink {
        color: var(--eve-ink);
      }

      .column-right .q-label {
        text-align: right;
      }

      .q-value {
        display: block;
        margin: 16px 0 0;
        padding: 0 0 8px;
        border: 0;
        border-bottom: 1px solid transparent;
        background: transparent;
        font-family: inherit;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.02em;
        line-height: 1.55;
        color: var(--eve-ink);
        min-height: 3.2em;
        width: 100%;
        outline: none;
        white-space: pre-wrap;
        word-break: break-word;
        text-align: inherit;
        transition: border-bottom-color 220ms ease;
      }

      .q-value[contenteditable="true"] {
        border-bottom-color: var(--eve-line);
        cursor: text;
      }

      .q-value[contenteditable="true"]:focus {
        border-bottom-color: var(--eve-ink);
      }

      .q-value.is-empty::before {
        content: attr(data-placeholder);
        color: var(--eve-mist-dim);
        pointer-events: none;
      }

      /* Señal central en el void — variación como evento */
      .signal {
        position: absolute;
        top: clamp(300px, 34vh, 400px);
        left: 50%;
        transform: translate(-50%, -50%);
        width: min(280px, 26vw);
        z-index: 2;
        text-align: center;
        pointer-events: none;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 800ms ease,
          visibility 800ms ease;
      }

      .signal.is-visible {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }

      .signal-question {
        margin: 0 0 22px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.02em;
        line-height: 1.5;
        color: var(--eve-ink);
        text-align: center;
      }

      .stance-stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }

      .stance {
        border: 0;
        background: transparent;
        padding: 4px 0;
        font-family: inherit;
        font-size: 10px;
        font-weight: 500;
        letter-spacing: 0.06em;
        color: var(--eve-mist);
        cursor: pointer;
        transition:
          color 400ms ease,
          font-weight 200ms ease;
      }

      .stance:hover {
        color: var(--eve-ink);
      }

      .stance.is-active {
        color: var(--eve-ink);
        font-weight: 700;
      }

      .signal-hint {
        margin: 18px 0 0;
        font-size: 7px;
        letter-spacing: 0.1em;
        line-height: 1.5;
        text-transform: uppercase;
        color: var(--eve-mist-dim);
        text-align: center;
      }

      .signal-note {
        margin-top: 22px;
        text-align: left;
        opacity: 0;
        visibility: hidden;
        max-height: 0;
        overflow: hidden;
        transition:
          opacity 500ms ease,
          visibility 500ms ease,
          max-height 500ms ease;
      }

      .signal-note.is-open {
        opacity: 1;
        visibility: visible;
        max-height: 180px;
      }

      .signal-note .q-label {
        text-align: left;
        color: var(--eve-ink);
      }

      /* Toggle de cierre — esquina derecha, patrón escena */
      .scene-toggle {
        display: block;
        width: 100%;
        margin: 36px 0 0;
        padding: 0;
        border: 0;
        background: transparent;
        font-family: inherit;
        font-size: 8px;
        font-weight: 700;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        line-height: 1.45;
        color: var(--eve-mist);
        text-align: right;
        cursor: pointer;
        opacity: 0;
        pointer-events: none;
        transition:
          color 220ms ease,
          opacity 400ms ease;
      }

      .scene-toggle.is-ready {
        opacity: 1;
        pointer-events: auto;
      }

      .scene-toggle.is-active {
        color: var(--eve-ink);
      }

      .scene-toggle:hover:not(:disabled) {
        color: var(--eve-ink);
      }

      .scene-toggle:disabled {
        cursor: not-allowed;
      }

      .closure-hint {
        margin: 12px 0 0;
        font-size: 7px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--eve-mist);
        text-align: right;
        opacity: 0;
        transition: opacity 400ms ease;
      }

      .closure-hint.is-visible {
        opacity: 1;
      }

      .ops-notify {
        position: fixed;
        left: 24px;
        bottom: 24px;
        max-width: 48ch;
        margin: 0;
        font-size: 8px;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--eve-mist);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 400ms ease;
        z-index: 20;
      }

      .ops-notify.is-visible {
        opacity: 1;
        visibility: visible;
      }

      .replay {
        position: fixed;
        bottom: 24px;
        right: 24px;
        border: 0;
        background: transparent;
        color: var(--eve-mist);
        font-family: inherit;
        font-size: 8px;
        font-weight: 500;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        cursor: pointer;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 400ms ease,
          color 200ms ease;
        z-index: 20;
      }

      .replay.is-visible {
        opacity: 1;
        pointer-events: auto;
      }

      .replay:hover {
        color: var(--eve-ink);
      }

      .compare {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        border: 0;
        background: transparent;
        color: var(--eve-mist-dim);
        font-family: inherit;
        font-size: 8px;
        font-weight: 500;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        text-decoration: none;
        cursor: pointer;
        z-index: 20;
      }

      .compare:hover {
        color: var(--eve-ink);
      }

      @media (max-width: 900px) {
        .field {
          position: relative;
          top: auto;
          left: auto;
          right: auto;
          margin-top: 160px;
          padding: 0 clamp(24px, 5vw, 72px);
          grid-template-columns: 1fr;
          gap: 48px;
          min-height: auto;
        }

        .column,
        .column-left,
        .column-right {
          max-width: none;
          justify-self: stretch;
          text-align: left;
        }

        .column-right .q-block {
          margin-left: 0;
        }

        .column-right .q-label,
        .scene-toggle,
        .closure-hint {
          text-align: left;
        }

        .signal {
          position: relative;
          top: auto;
          left: auto;
          transform: none;
          width: auto;
          max-width: 42ch;
          margin: 48px clamp(24px, 5vw, 72px) 0;
          text-align: left;
        }

        .stance-stack {
          align-items: flex-start;
        }

        .signal-question,
        .signal-hint {
          text-align: left;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .intro-corner,
        .field,
        .q-block,
        .signal,
        .signal-note,
        .scene-toggle,
        .ops-notify,
        .replay {
          transition: none !important;
        }

        .cursor {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <p class="build" id="build">BUILD 2.0 · PROPUESTA 2 · TRIÁNGULO</p>
    <p class="error" id="error" role="alert"></p>

    <main class="screen" aria-label="B0 sección 3 · frecuencia · propuesta 2">
      <header class="intro-corner" id="intro-corner" aria-live="polite">
        <p class="stage-intro-lead">III · Frecuencia</p>
        <p class="stage-intro-ask">
          <span id="intro-ask-text"></span
          ><span class="cursor is-hidden" id="intro-cursor" aria-hidden="true"></span>
        </p>
      </header>

      <section class="field" id="field" aria-label="Frecuencia, contexto y actor">
        <div class="column column-left" aria-label="Frecuencia y actor">
          <article class="q-block" id="block-frequency" data-field="frequency_base">
            <p class="q-label" id="label-frequency"></p>
            <div
              class="q-value is-empty"
              contenteditable="false"
              data-placeholder="Ej. Todos los días, cada semana, bajo demanda…"
              id="value-frequency"
              role="textbox"
              aria-label="Con qué frecuencia"
            ></div>
          </article>

          <article class="q-block" id="block-actor" data-field="primary_actor_scope">
            <p class="q-label" id="label-actor"></p>
            <div
              class="q-value is-empty"
              contenteditable="false"
              data-placeholder="Ej. Yo, yo con mi equipo…"
              id="value-actor"
              role="textbox"
              aria-label="Quién hace esta actividad"
            ></div>
          </article>
        </div>

        <div class="column column-right" aria-label="Situación y cierre">
          <article class="q-block" id="block-context" data-field="typical_context">
            <p class="q-label" id="label-context"></p>
            <div
              class="q-value is-empty"
              contenteditable="false"
              data-placeholder="Ej. Cuando cierra el reporte…"
              id="value-context"
              role="textbox"
              aria-label="En qué situación suele pasar"
            ></div>
          </article>

          <button
            class="scene-toggle"
            id="scene-toggle"
            type="button"
            disabled
            aria-label="Guardar anclaje de frecuencia"
          >
            Así es · Guardar
          </button>
          <p class="closure-hint" id="closure-hint">
            Completa las tres piezas y elige si a veces cambia
          </p>
        </div>
      </section>

      <!--
        Señal en el void (desktop: absolute al centro).
        En DOM va después del field para que en móvil el orden sea
        campos → variación (no al revés).
      -->
      <div class="signal" id="signal" aria-label="Variación de la actividad">
        <p class="signal-question">
          ¿A veces cambia según el caso o la urgencia?
        </p>
        <div class="stance-stack" role="group" aria-label="Si la actividad a veces cambia">
          <button class="stance" id="stance-yes" type="button">
            Sí, a veces cambia
          </button>
          <button class="stance" id="stance-no" type="button">
            No, casi siempre es igual
          </button>
        </div>
        <p class="signal-hint">
          Nota opcional de variación · no cierra la unidad base
        </p>
        <div class="signal-note" id="signal-note">
          <p class="q-label">Qué suele cambiar</p>
          <div
            class="q-value is-empty"
            contenteditable="true"
            data-placeholder="Ej. Si hay urgencia, salto pasos o lo hago con menos revisión"
            id="value-variation-note"
            role="textbox"
            aria-label="Qué suele cambiar"
          ></div>
        </div>
      </div>
    </main>

    <p class="ops-notify" id="ops-notify" role="status" aria-live="polite"></p>
    <a class="compare" href="./eve-b0-frecuencia-void-v1.html">Ver propuesta 1</a>
    <button class="replay" id="replay" type="button">Repetir secuencia</button>

    <script>
      const BUILD = "2.0";
      const STORAGE_KEY = "eve-b0-frecuencia-void-v2";
      const INTRO_ASK = "Ubica cada cuánto ocurre, el contexto típico y quién la realiza.";

      /**
       * Orden de materialización en el triángulo:
       * 1 frecuencia (izq) → 2 contexto (der) → 3 actor (izq abajo)
       * Luego señal central (variación).
       */
      const FIELD_ORDER = [
        {
          id: "frequency",
          label: "Con qué frecuencia",
          demo:
            "Bajo demanda, cada vez que un pedido requiere solicitar y enviar una factura de anticipo o de finiquito.",
        },
        {
          id: "context",
          label: "En qué situación suele pasar",
          demo:
            "Cuando la cotización final ya fue aceptada por el cliente, cuento con sus datos fiscales y corresponde gestionar el anticipo o el finiquito del pedido.",
        },
        {
          id: "actor",
          label: "Quién hace esta actividad",
          demo: "Yo, como ejecutiva de ventas.",
        },
      ];

      const params = new URLSearchParams(window.location.search);
      const fillDemo = params.get("demo") !== "0";
      const reducedMotion =
        window.matchMedia &&
        window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const introCorner = document.getElementById("intro-corner");
      const introAskText = document.getElementById("intro-ask-text");
      const introCursor = document.getElementById("intro-cursor");
      const fieldEl = document.getElementById("field");
      const signalEl = document.getElementById("signal");
      const signalNote = document.getElementById("signal-note");
      const stanceYes = document.getElementById("stance-yes");
      const stanceNo = document.getElementById("stance-no");
      const sceneToggle = document.getElementById("scene-toggle");
      const closureHint = document.getElementById("closure-hint");
      const opsNotifyEl = document.getElementById("ops-notify");
      const replayEl = document.getElementById("replay");
      const errorEl = document.getElementById("error");
      const noteValue = document.getElementById("value-variation-note");

      const fields = FIELD_ORDER.map((def) => ({
        ...def,
        block: document.getElementById("block-" + def.id),
        label: document.getElementById("label-" + def.id),
        value: document.getElementById("value-" + def.id),
      }));

      let runToken = 0;
      let variationChoice = null;
      let captureReady = false;
      let saved = false;

      function sleep(ms, isAlive) {
        return new Promise((resolve) => {
          window.setTimeout(() => resolve(isAlive()), ms);
        });
      }

      function showError(message) {
        errorEl.textContent = message;
        errorEl.classList.add("is-visible");
      }

      function clearError() {
        errorEl.textContent = "";
        errorEl.classList.remove("is-visible");
      }

      function syncEmptyState(el) {
        const text = (el.textContent || "").replace(/\u200b/g, "").trim();
        el.classList.toggle("is-empty", text.length === 0);
      }

      async function typeText(text, speed, isAlive, onChar) {
        if (reducedMotion) {
          onChar(text);
          return isAlive();
        }
        let acc = "";
        for (let i = 0; i < text.length; i += 1) {
          if (!isAlive()) return false;
          acc += text.charAt(i);
          onChar(acc);
          const alive = await sleep(speed, isAlive);
          if (!alive) return false;
        }
        return isAlive();
      }

      function setEditable(enabled) {
        captureReady = enabled;
        fields.forEach((field) => {
          field.value.contentEditable = enabled ? "true" : "false";
          if (enabled) field.label.classList.add("is-ink");
        });
      }

      function readField(el) {
        return (el.textContent || "").replace(/\u200b/g, "").trim();
      }

      function canSave() {
        const fieldsOk = fields.every((field) => readField(field.value).length > 0);
        if (!fieldsOk || variationChoice === null) return false;
        if (variationChoice === "yes" && readField(noteValue).length === 0) {
          return false;
        }
        return true;
      }

      function refreshClosure() {
        if (saved) return;
        const ready = canSave();
        sceneToggle.disabled = !ready;
        sceneToggle.classList.toggle("is-ready", ready);
        closureHint.classList.toggle("is-visible", !ready);
        if (!ready) {
          if (variationChoice === "yes" && readField(noteValue).length === 0) {
            closureHint.textContent =
              "Cuéntanos qué suele cambiar cuando no es el caso normal";
          } else if (variationChoice === null) {
            closureHint.textContent =
              "Completa las tres piezas y elige si a veces cambia";
          } else {
            closureHint.textContent =
              "Completa frecuencia, situación y quién la hace";
          }
        }
      }

      function setVariation(choice) {
        if (!captureReady || saved) return;
        variationChoice = choice;
        stanceYes.classList.toggle("is-active", choice === "yes");
        stanceNo.classList.toggle("is-active", choice === "no");
        signalNote.classList.toggle("is-open", choice === "yes");
        if (choice === "no") {
          noteValue.textContent = "";
          syncEmptyState(noteValue);
        }
        refreshClosure();
      }

      function persist(payload) {
        try {
          localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify({ build: BUILD, savedAt: Date.now(), ...payload }),
          );
        } catch (err) {
          showError("No se pudo persistir en localStorage (demo local).");
        }
      }

      function handleSave() {
        if (!canSave() || saved) return;
        saved = true;
        sceneToggle.classList.add("is-active");
        stanceYes.disabled = true;
        stanceNo.disabled = true;
        setEditable(false);
        closureHint.classList.remove("is-visible");

        const payload = {
          proposal: 2,
          frequency_base: readField(fields[0].value),
          typical_context: readField(fields[1].value),
          primary_actor_scope: readField(fields[2].value),
          variation_choice: variationChoice,
          variation_note:
            variationChoice === "yes" ? readField(noteValue) : null,
        };
        persist(payload);

        opsNotifyEl.textContent =
          "B0-Q03 cerrado · triángulo · variación " +
          (variationChoice === "yes" ? "activa" : "estable") +
          " · listo para B0.5";
        opsNotifyEl.classList.add("is-visible");
        replayEl.classList.add("is-visible");
      }

      function bindEditors() {
        fields.forEach((field) => {
          field.value.addEventListener("input", () => {
            syncEmptyState(field.value);
            refreshClosure();
          });
          field.value.addEventListener("blur", () => syncEmptyState(field.value));
        });
        noteValue.addEventListener("input", () => {
          syncEmptyState(noteValue);
          refreshClosure();
        });
        noteValue.addEventListener("blur", () => syncEmptyState(noteValue));
        stanceYes.addEventListener("click", () => setVariation("yes"));
        stanceNo.addEventListener("click", () => setVariation("no"));
        sceneToggle.addEventListener("click", handleSave);
        replayEl.addEventListener("click", () => {
          runToken += 1;
          void runSequence();
        });
      }

      function resetUi() {
        clearError();
        saved = false;
        variationChoice = null;
        captureReady = false;

        introCorner.classList.remove("is-active");
        introAskText.textContent = "";
        introCursor.classList.add("is-hidden");
        fieldEl.classList.remove("is-visible");
        signalEl.classList.remove("is-visible");
        signalNote.classList.remove("is-open");
        closureHint.classList.remove("is-visible");
        opsNotifyEl.classList.remove("is-visible");
        opsNotifyEl.textContent = "";
        replayEl.classList.remove("is-visible");

        stanceYes.classList.remove("is-active");
        stanceNo.classList.remove("is-active");
        stanceYes.disabled = false;
        stanceNo.disabled = false;

        sceneToggle.disabled = true;
        sceneToggle.classList.remove("is-ready", "is-active");

        fields.forEach((field) => {
          field.block.classList.remove("is-active");
          field.label.textContent = "";
          field.label.classList.remove("is-ink");
          field.value.textContent = "";
          field.value.contentEditable = "false";
          syncEmptyState(field.value);
        });
        noteValue.textContent = "";
        syncEmptyState(noteValue);
      }

      async function runSequence() {
        const token = ++runToken;
        const isAlive = () => token === runToken;
        resetUi();

        await sleep(reducedMotion ? 0 : 420, isAlive);
        if (!isAlive()) return;

        introCorner.classList.add("is-active");
        introCursor.classList.remove("is-hidden");
        const typed = await typeText(
          INTRO_ASK,
          reducedMotion ? 0 : 28,
          isAlive,
          (partial) => {
            introAskText.textContent = partial;
          },
        );
        if (!typed) return;
        introCursor.classList.add("is-hidden");

        await sleep(reducedMotion ? 0 : 360, isAlive);
        if (!isAlive()) return;

        fieldEl.classList.add("is-visible");

        for (let i = 0; i < fields.length; i += 1) {
          if (!isAlive()) return;
          const field = fields[i];
          field.block.classList.add("is-active");
          const labelOk = await typeText(
            field.label,
            reducedMotion ? 0 : 20,
            isAlive,
            (partial) => {
              field.label.textContent = partial;
            },
          );
          if (!labelOk) return;

          if (fillDemo) {
            await sleep(reducedMotion ? 0 : 100, isAlive);
            if (!isAlive()) return;
            field.value.textContent = field.demo;
            syncEmptyState(field.value);
          }

          await sleep(reducedMotion ? 0 : 200, isAlive);
          if (!isAlive()) return;
        }

        setEditable(true);
        signalEl.classList.add("is-visible");
        closureHint.classList.add("is-visible");
        refreshClosure();
        replayEl.classList.add("is-visible");
      }

      bindEditors();
      document.getElementById("build").textContent =
        "BUILD 2.0 · PROPUESTA 2 · TRIÁNGULO · B0-Q03";

      void runSequence().catch((err) => {
        showError(String(err && err.message ? err.message : err));
      });
    </script>
  </body>
</html>
